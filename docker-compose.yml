services:
  api:
    build: ./amarhan-api
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - APP=amarhan-api
      # Жишээ нууц ашиглахгүй — .env файлаас заавал ирнэ, байхгүй бол эхлэхгүй.
      - APP_SECRET=${APP_SECRET:?APP_SECRET тохируулаагүй байна — .env файлд оруулна уу}
      - MONGOURI=mongodb://mongo:27017/amarhan?replicaSet=rs0&directConnection=true
      - SESSION_SECRET=${SESSION_SECRET:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - NODE_ENV=${NODE_ENV:-development}
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Транзакц ашиглахын тулд MongoDB заавал replica set горимд байх ёстой.
  # Ачаа/төлбөр/audit log-ийг атомик бичих шаардлагатай (docs/architecture.md §4.3).
  # Ганц node ч replica set болж чадна.
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Replica set-ийг нэг удаа эхлүүлнэ. Аль хэдийн эхэлсэн бол чимээгүй өнгөрнө.
  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - bash
      - -c
      - |
        mongosh --host mongo:27017 --quiet --eval '
          try {
            rs.status();
            print("Replica set аль хэдийн ажиллаж байна");
          } catch (e) {
            rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongo:27017" }] });
            print("Replica set rs0 эхлүүллээ");
          }
        '

volumes:
  mongo_data:
